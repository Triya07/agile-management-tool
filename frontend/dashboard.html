<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Dashboard | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f7f8fa; font-family: 'Segoe UI', Arial, sans-serif; color: #222; }
    .main-container { display: flex; min-height: 100vh; }
    #main-content { flex: 1; padding: 32px 40px; }
    .dashboard-section { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 24px; margin-bottom: 28px; }
    .dashboard-title { font-size: 2rem; font-weight: 600; margin-bottom: 18px; }
    .project-list { margin-bottom: 18px; }
    .project-card { display: inline-block; background: #f7fafc; border-radius: 8px; padding: 14px 22px; margin-right: 16px; margin-bottom: 10px; cursor: pointer; border: 1px solid #e2e8f0; }
    .project-card.active { background: #e0e7ff; border-color: #6366f1; }
    .btn { background: #3182ce; color: #fff; border: none; border-radius: 7px; padding: 10px 22px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .task-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .task-table th, .task-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; text-align: left; }
    .task-table th { background: #f7f8fa; }
    .status-badge { border-radius: 6px; padding: 2px 10px; font-size: 0.95rem; }
    .status-todo { background: #fef9c3; color: #b45309; }
    .status-inprogress { background: #dbeafe; color: #2563eb; }
    .status-done { background: #bbf7d0; color: #15803d; }
    .progress-bar-bg { background: #e5e7eb; border-radius: 8px; height: 18px; width: 100%; margin-top: 8px; }
    .progress-bar-fill { background: #3182ce; height: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <!-- ...existing code... -->
    </aside>
    <main id="main-content">
      <div class="dashboard-section">
        <div class="dashboard-title">Manager Dashboard</div>
        <div>
          <strong>Projects:</strong>
          <span id="projectList" class="project-list"></span>
          <button class="btn" id="addProjectBtn">+ Add Project</button>
        </div>
        <div style="margin-top:18px;">
          <button class="btn" id="openBoardBtn" style="margin-right:10px;">Open Board</button>
          <button class="btn" id="openSprintsBtn">Open Sprints</button>
        </div>
      </div>
      <div class="dashboard-section">
        <div style="font-size:1.2rem;font-weight:500;margin-bottom:10px;">Team Progress</div>
        <div id="progressBar" class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill" style="width:0%"></div></div>
        <div id="progressText" style="margin-top:6px;font-size:1rem;"></div>
      </div>
      <div class="dashboard-section">
        <div style="font-size:1.2rem;font-weight:500;margin-bottom:10px;">All Tasks</div>
        <table class="task-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Assignee</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script>
    // --- Project selection ---
    let projects = JSON.parse(localStorage.getItem("projects")) || [];
    let activeProjectId = localStorage.getItem("activeProject");
    function renderProjects() {
      const list = document.getElementById("projectList");
      list.innerHTML = "";
      projects.forEach(p => {
        const btn = document.createElement("span");
        btn.className = "project-card" + (p.id === activeProjectId ? " active" : "");
        btn.textContent = p.name + " (" + p.type + ")";
        btn.onclick = () => {
          activeProjectId = p.id;
          localStorage.setItem("activeProject", p.id);
          renderProjects();
          renderTasks();
          renderProgress();
        };
        list.appendChild(btn);
      });
    }
    document.getElementById("addProjectBtn").onclick = function() {
      const name = prompt("Project name:");
      if (!name) return;
      const type = prompt("Type (scrum/kanban):", "scrum");
      if (!type) return;
      const newProj = { id: Date.now().toString(), name, type };
      projects.push(newProj);
      localStorage.setItem("projects", JSON.stringify(projects));
      renderProjects();
    };

    // --- Board navigation ---
    document.getElementById("openBoardBtn").onclick = function() {
      if (!activeProjectId) return alert("Select a project first!");
      const proj = projects.find(p => p.id === activeProjectId);
      if (proj.type === "scrum") window.location.href = "scrum-board.html";
      else window.location.href = "board.html";
    };
    document.getElementById("openSprintsBtn").onclick = function() {
      if (!activeProjectId) return alert("Select a project first!");
      window.location.href = "sprints.html";
    };

    // --- Tasks and progress ---
    function renderTasks() {
      const tasks = (JSON.parse(localStorage.getItem("tasks")) || []).filter(t => t.projectId === activeProjectId);
      const tbody = document.getElementById("taskTableBody");
      tbody.innerHTML = "";
      tasks.forEach(task => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${task.title}</td>
          <td>
            <span class="status-badge status-${task.status}">${task.status.replace("inprogress", "In Progress").replace("todo", "To Do").replace("done", "Done")}</span>
          </td>
          <td>${task.assignee || "<em>Unassigned</em>"}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    function renderProgress() {
      const tasks = (JSON.parse(localStorage.getItem("tasks")) || []).filter(t => t.projectId === activeProjectId);
      const done = tasks.filter(t => t.status === "done").length;
      const total = tasks.length;
      const percent = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressText").textContent = total ? `${done} of ${total} tasks done (${percent}%)` : "No tasks yet";
    }

    // --- Initial render ---
    renderProjects();
    renderTasks();
    renderProgress();
  </script>
</body>
</html>
