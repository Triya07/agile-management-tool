<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Dashboard | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --sidebar-width: 300px;
    }
    
    body { 
      background: linear-gradient(135deg, #F7FCEB 0%, #ECFDF0 25%, #D1FAE5 50%, #A7F3D0 75%, #6EE7B7 100%); 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #083344; 
    }
    
    .main-container { 
      display: flex; 
      min-height: 100vh; 
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      transition: margin-left 0.3s ease, width 0.3s ease;
    }
    
    #main-content { 
      flex: 1; 
      padding: 32px 40px; 
      background: transparent;
    }
    
    .dashboard-title {
      background: linear-gradient(135deg, #76C893, #52B69A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 32px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, rgba(118, 200, 147, 0.1), rgba(82, 182, 154, 0.05));
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      border: 1px solid rgba(118, 200, 147, 0.2);
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(8, 51, 68, 0.12);
    }
    
    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #76C893, #52B69A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .stat-label {
      color: #34A0A4;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .dashboard-section {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 15px;
      padding: 28px;
      margin-bottom: 24px;
      border: 1px solid rgba(118, 200, 147, 0.2);
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08);
    }
    
    .section-title {
      color: #34A0A4;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    
    .btn {
      background: linear-gradient(135deg, #76C893, #52B69A);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 12px;
      margin-bottom: 8px;
    }
    
    .btn:hover {
      background: linear-gradient(135deg, #52B69A, #34A0A4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 182, 154, 0.25);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;color:#D9ED92;">FlowBoard</span>
        <button class="sidebar-resize-btn" id="sidebarResizeBtn" title="Toggle sidebar size">⟷</button>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" onclick="navigateTo('kanban-board.html')">Kanban Board</button>
        <button class="sidebar-btn" onclick="navigateTo('projects.html')">Projects</button>
        <button class="sidebar-btn active">Dashboard</button>
        <button class="sidebar-btn" onclick="navigateTo('sprint.html')">Sprints</button>
        <button class="sidebar-btn" onclick="navigateTo('team.html')">Team</button>
        <button class="sidebar-btn" onclick="navigateTo('user-profile.html')">Profile</button>
        <button class="sidebar-btn" onclick="navigateTo('settings.html')">Settings</button>
        <button class="sidebar-btn" onclick="logout()">Logout</button>
      </nav>
    </aside>
    
    <main id="main-content">
      <h1 class="dashboard-title">Manager Dashboard</h1>
      
      <div class="stats-grid">
        <div class="stat-card" onclick="navigateTo('projects.html')">
          <div class="stat-number" id="totalProjects">3</div>
          <div class="stat-label">Active Projects</div>
        </div>
        <div class="stat-card" onclick="navigateTo('sprint.html')">
          <div class="stat-number" id="totalSprints">2</div>
          <div class="stat-label">Active Sprints</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="totalTasks">15</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="teamMembers">8</div>
          <div class="stat-label">Team Members</div>
        </div>
      </div>
      
      <div class="dashboard-section">
        <h3 class="section-title">Quick Actions</h3>
        <button class="btn" onclick="navigateTo('projects.html')">Create New Project</button>
        <button class="btn" onclick="navigateTo('sprint.html')">Start New Sprint</button>
        <button class="btn" onclick="navigateTo('kanban-board.html')">View Kanban Board</button>
        <button class="btn" onclick="navigateTo('scrum-updates.html')">View Team Updates</button>
      </div>
      
      <div class="dashboard-section">
        <h3 class="section-title">Recent Activity</h3>
        <div id="recentActivity">
          <div style="padding: 12px 0; border-bottom: 1px solid rgba(118, 200, 147, 0.2);">
            <strong>Project "Mobile App"</strong> was created 2 hours ago
          </div>
          <div style="padding: 12px 0; border-bottom: 1px solid rgba(118, 200, 147, 0.2);">
            <strong>Sprint 2</strong> completed successfully yesterday
          </div>
          <div style="padding: 12px 0;">
            <strong>5 new tasks</strong> added to backlog today
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Global navigation and utility functions
    function navigateTo(page) {
      window.location.href = page;
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }
    
    // Sidebar functionality
    const root = document.documentElement;
    const sidebar = document.getElementById('sidebar');
    const resizeBtn = document.getElementById('sidebarResizeBtn');
    
    let sidebarState = 'normal';
    
    function setSidebarWidth(width) {
      root.style.setProperty('--sidebar-width', width + 'px');
      localStorage.setItem('sidebarWidth', width);
      
      if (sidebar) {
        sidebar.classList.remove('compact', 'wide');
        if (width <= 250) {
          sidebar.classList.add('compact');
          sidebarState = 'compact';
        } else if (width >= 380) {
          sidebar.classList.add('wide');
          sidebarState = 'wide';
        } else {
          sidebarState = 'normal';
        }
      }
    }
    
    const savedWidth = localStorage.getItem('sidebarWidth');
    if (savedWidth) {
      setSidebarWidth(parseInt(savedWidth));
    }
    
    if (resizeBtn) {
      resizeBtn.addEventListener('click', () => {
        if (sidebarState === 'compact') {
          setSidebarWidth(300);
        } else if (sidebarState === 'normal') {
          setSidebarWidth(400);
        } else {
          setSidebarWidth(220);
        }
      });
    }
  </script>
</body>
</html>
