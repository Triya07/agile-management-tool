<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Management | FlowBoard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 50%, #ccfdf7 100%); 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #083344; 
    }
    .main-container { 
      display: flex; 
      min-height: 100vh; 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
    }
    .team-section { 
      background: rgba(255, 255, 255, 0.8); 
      border-radius: 15px; 
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08); 
      padding: 28px; 
      margin-bottom: 24px; 
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    .btn { 
      background: linear-gradient(135deg, #0891b2, #22c55e); 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      padding: 12px 24px; 
      cursor: pointer; 
      font-weight: 600;
    }
    .btn:hover { 
      background: linear-gradient(135deg, #22c55e, #059669); 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.25);
    }
    .overview-card { 
      background: linear-gradient(135deg, #0891b2 0%, #22c55e 100%); 
      color: white; 
      padding: 20px; 
      border-radius: 12px; 
    }
    .overview-card.secondary { 
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%); 
    }
    .overview-card.success { 
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); 
    }
    .card-number { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
    .card-label { font-size: 0.9rem; opacity: 0.9; }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .member-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; transition: all 0.3s; border-left: 4px solid #3182ce; }
    .member-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
    .member-header { display: flex; align-items: center; margin-bottom: 12px; }
    .member-avatar-large { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2rem; margin-right: 16px; }
    .member-status { padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin-left: auto; }
    .status-online { background: #d1fae5; color: #065f46; }
    .status-offline { background: #fef2f2; color: #991b1b; }
    .member-stats { display: flex; justify-content: space-between; margin: 12px 0; }
    .stat { text-align: center; }
    .stat-number { font-size: 1.4rem; font-weight: 600; color: #3182ce; }
    .stat-label { font-size: 0.8rem; color: #666; }
    .task-timeline { margin-top: 12px; }
    .timeline-item { display: flex; align-items: center; padding: 4px 0; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
    .timeline-dot.todo { background: #fbbf24; }
    .timeline-dot.progress { background: #3b82f6; }
    .timeline-dot.done { background: #10b981; }
    .calendar-widget { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .calendar-nav { background: #f3f4f6; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .calendar-day:hover { background: #e5e7eb; }
    .calendar-day.today { background: #3b82f6; color: white; }
    .calendar-day.has-task { background: #fef3c7; color: #d97706; font-weight: 600; }
    .activity-feed { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; max-height: 400px; overflow-y: auto; }
    .activity-item { display: flex; align-items: start; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 0.8rem; }
    .activity-assigned { background: #dbeafe; color: #1d4ed8; }
    .activity-completed { background: #d1fae5; color: #065f46; }
    .activity-updated { background: #fef3c7; color: #d97706; }
    .assign-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1200;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .assign-modal .modal-content {
      width: min(640px, 96vw);
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 16px 40px rgba(2, 6, 23, 0.25);
    }
    .modal-header {
      margin-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 10px;
    }
    .modal-body { padding-top: 6px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-weight: 600; margin-bottom: 6px; color: #0f172a; }
    .form-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background: #fff;
    }
    .date-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .priority-selector { display: flex; gap: 8px; }
    .priority-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
    }
    .priority-btn.active {
      background: linear-gradient(135deg, #0891b2, #22c55e);
      color: #fff;
      border-color: transparent;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .action-btn { cursor: pointer; }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#0891b2,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FlowBoard</span>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" onclick="navigateTo('dashboard.html')">Dashboard</button>
        <button class="sidebar-btn" onclick="navigateTo('projects.html')">Projects</button>
        <button class="sidebar-btn" onclick="navigateTo('kanban-board.html')">Kanban Board</button>
        <button class="sidebar-btn" onclick="navigateTo('sprint.html')">Sprints</button>
        <button class="sidebar-btn active">Team</button>
        <button class="sidebar-btn" onclick="navigateTo('user-profile.html')">Profile</button>
        <button class="sidebar-btn" onclick="navigateTo('settings.html')">Settings</button>
        <button class="sidebar-btn" onclick="logout()">Logout</button>
      </nav>
    </aside>
    <main id="main-content">
      <!-- Overview Cards -->
      <div class="overview-cards">
        <div class="overview-card">
          <div class="card-number" id="totalMembers">0</div>
          <div class="card-label">Team Members</div>
        </div>
        <div class="overview-card secondary">
          <div class="card-number" id="activeTasks">0</div>
          <div class="card-label">Active Tasks</div>
        </div>
        <div class="overview-card success">
          <div class="card-number" id="completedToday">0</div>
          <div class="card-label">Completed Today</div>
        </div>
      </div>

      <div class="team-dashboard">
        <div class="main-panel">
          <div class="team-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
              <h2 style="margin:0;">Team Management</h2>
              <div>
                <button class="btn" id="addMemberBtn" style="margin-right:12px;">+ Add Member</button>
                <button class="btn" onclick="openBulkAssignModal()" style="background:#6366f1;">Bulk Assign</button>
              </div>
            </div>
            <div class="team-grid" id="teamGrid"></div>
          </div>
        </div>

        <div class="side-panel">
          <!-- Calendar Widget -->
          <div class="calendar-widget">
            <div class="calendar-header">
              <h3 style="margin:0;">Task Calendar</h3>
              <div>
                <button class="calendar-nav" id="prevMonth">‹</button>
                <span id="currentMonth"></span>
                <button class="calendar-nav" id="nextMonth">›</button>
              </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>

          <!-- Activity Feed -->
          <div class="activity-feed">
            <h3 style="margin-top:0;">Recent Activity</h3>
            <div id="activityList"></div>
          </div>
        </div>
          <div class="activity-feed" style="margin-top:16px;">
            <h3 style="margin-top:0;">Team Membership</h3>
            <div id="inviteList">
              <p style="color:#64748b;margin:0;">Member invitations are not implemented yet. Use the real project membership flow after a teammate has signed up.</p>
            </div>
          </div>
      </div>
    </main>
  </div>

  <!-- Enhanced Assign Task Modal -->
  <div id="assignModal" class="assign-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0;">Assign Task</h3>
      </div>
      <div class="modal-body">
        <form id="assignTaskForm">
          <div class="form-group">
            <label class="form-label">Select Task:</label>
            <select id="taskSelect" class="form-input" title="Task"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Assign to:</label>
            <select id="memberSelect" class="form-input" title="Team member"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Priority:</label>
            <div class="priority-selector">
              <div class="priority-btn" data-priority="low">Low</div>
              <div class="priority-btn active" data-priority="medium">Medium</div>
              <div class="priority-btn" data-priority="high">High</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Due Date:</label>
            <div class="date-picker">
              <input type="date" id="startDate" class="form-input" title="Start date">
              <input type="date" id="dueDate" class="form-input" title="Due date">
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;">
            <button type="button" class="btn btn-secondary" onclick="closeAssignModal()">Cancel</button>
            <button type="submit" class="btn">Assign Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="memberTasksModal" class="assign-modal">
    <div class="modal-content" style="max-width:640px;">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;" id="memberTasksTitle">Member Tasks</h3>
        <button class="btn btn-secondary" type="button" onclick="closeMemberTasksModal()">Close</button>
      </div>
      <div class="modal-body" id="memberTasksContent"></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
     // AUTH GUARD — paste at top of every protected page
(function() {
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || 'null');
  if (!token || !user) {
    window.location.href = 'login.html';
    return;
  }

  if (user.role !== 'manager') {
    window.location.href = 'dashboard-team.html';
  }
})();

    // Global navigation and utility functions
    function navigateTo(page) {
      window.location.href = page;
    }

    // Team members and data
    let teamMembers = [];
    let allTasks = [];
    let allProjects = [];
    const currentUser = getCurrentUser();
    let currentProjectId = getActiveContext().projectId || 'global';

    // Load data from API
    async function loadTeamData() {
      try {
        const projectsData = await getProjects();
        const membersData = await getMemberDirectory();

        allProjects = Array.isArray(projectsData) ? projectsData : (projectsData.data || []);
        const apiMembers = (Array.isArray(membersData) ? membersData : []).map(member => ({
          id: member._id,
          name: member.name,
          email: member.email,
          role: member.jobTitle || member.department || 'Member'
        }));

        if (apiMembers.length) {
          teamMembers = apiMembers;
        } else {
          // Fallback: derive members from project member arrays.
          const memberMap = new Map();
          allProjects.forEach(project => {
            (project.members || []).forEach(member => {
              const memberId = member && (member._id || member.id || member);
              if (!memberId) return;

              if (!memberMap.has(String(memberId))) {
                memberMap.set(String(memberId), {
                  id: String(memberId),
                  name: member.name || member.email || 'Team Member',
                  email: member.email || '',
                  role: member.role || 'Member'
                });
              }
            });
          });
          teamMembers = Array.from(memberMap.values());
        }

        const taskLists = await Promise.all(
          allProjects.map(async (project) => {
            try {
              const projectTasks = await getProjectTasks(project._id);
              const normalized = Array.isArray(projectTasks) ? projectTasks : (projectTasks.data || []);
              return normalized.map(task => ({ ...task, projectName: project.name }));
            } catch (e) {
              console.log("Could not fetch tasks for project", project._id);
              return [];
            }
          })
        );

        allTasks = taskLists.flat();

        if (!currentProjectId || currentProjectId === 'global') {
          currentProjectId = allProjects[0]?._id || 'global';
        }
        
        renderTeam();
        renderCalendar();
        updateActivityFeed();
      } catch (error) {
        console.error('Error loading team data:', error);
        alert('Failed to load team data from database.');
      }
    }

    function renderTeam() {
      const teamGrid = document.getElementById("teamGrid");
      teamGrid.innerHTML = "";
      
      teamMembers.forEach(member => {
        const memberTasks = getUserTasks(member.id);
        const completedTasks = memberTasks.filter(t => t.status === 'done').length;
        const inProgressTasks = memberTasks.filter(t => t.status === 'inprogress').length;
        
        const div = document.createElement("div");
        div.className = "member-card";
        div.innerHTML = `
          <div class="member-header">
            <div class="member-avatar-large">${member.name.charAt(0)}</div>
            <div>
              <h4 style="margin:0;">${member.name}</h4>
              <p style="margin:2px 0;color:#666;">${member.role}</p>
            </div>
            <div class="member-status status-online">Online</div>
          </div>
          
          <div class="member-stats">
            <div class="stat">
              <div class="stat-number">${memberTasks.length}</div>
              <div class="stat-label">Total</div>
            </div>
            <div class="stat">
              <div class="stat-number">${inProgressTasks}</div>
              <div class="stat-label">Active</div>
            </div>
            <div class="stat">
              <div class="stat-number">${completedTasks}</div>
              <div class="stat-label">Done</div>
            </div>
          </div>
          
          <div class="task-timeline">
            ${memberTasks.slice(0,3).map(task => `
              <div class="timeline-item">
                <div class="timeline-dot ${task.status}"></div>
                <span style="font-size:0.85rem;">${task.title}</span>
              </div>
            `).join('')}
          </div>
          
          <div style="display:flex;gap:8px;margin-top:16px;">
            <button class="btn action-btn assign-task-btn" data-member-id="${member.id}" style="flex:1;font-size:0.9rem;">Assign Task</button>
            <button class="btn btn-secondary action-btn view-tasks-btn" data-member-id="${member.id}" style="flex:1;font-size:0.9rem;">View All</button>
          </div>
        `;
        teamGrid.appendChild(div);
      });
      
      updateOverviewCards();
    }
    
    function getUserTasks(userId) {
      return allTasks.filter(t => {
        const assignedTo = t.assignedTo ? (t.assignedTo._id || t.assignedTo) : null;
        return String(assignedTo || '') === String(userId);
      });
    }
    
    function updateOverviewCards() {
      const today = new Date().toISOString().split('T')[0];
      
      document.getElementById("totalMembers").textContent = teamMembers.length;
      document.getElementById("activeTasks").textContent = allTasks.filter(t => t.status !== 'done').length;
      document.getElementById("completedToday").textContent = allTasks.filter(t => t.status === 'done' && t.completedAt && new Date(t.completedAt).toISOString().split('T')[0] === today).length;
    }
    
    // Calendar functionality
    let currentDate = new Date();
    
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDay = firstDay.getDay();
      
      document.getElementById("currentMonth").textContent = 
        new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);
      
      const calendarGrid = document.getElementById("calendarGrid");
      calendarGrid.innerHTML = "";
      
      // Day headers
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
        const dayHeader = document.createElement("div");
        dayHeader.textContent = day;
        dayHeader.style.fontWeight = "600";
        dayHeader.style.color = "#6b7280";
        dayHeader.style.fontSize = "0.75rem";
        dayHeader.style.textAlign = "center";
        dayHeader.style.padding = "8px 0";
        calendarGrid.appendChild(dayHeader);
      });
      
      // Empty cells for days before month starts
      for (let i = 0; i < startingDay; i++) {
        calendarGrid.appendChild(document.createElement("div"));
      }
      
      // Days of the month
      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement("div");
        dayElement.className = "calendar-day";
        dayElement.textContent = day;
        
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const today = new Date().toISOString().split('T')[0];
        
        if (dateStr === today) {
          dayElement.classList.add("today");
        }
        
        // Check if there are tasks due on this date
        if (allTasks.some(t => t.dueDate && new Date(t.dueDate).toISOString().split('T')[0] === dateStr)) {
          dayElement.classList.add("has-task");
        }
        
        calendarGrid.appendChild(dayElement);
      }
    }
    
    document.getElementById("prevMonth").onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    };
    
    document.getElementById("nextMonth").onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    };
    
    // Activity feed
    function updateActivityFeed() {
      const activityList = document.getElementById("activityList");
      activityList.innerHTML = "";
      
      // Generate activities from tasks
      const activities = [];
      
      allTasks.forEach(task => {
        if (task.createdAt) {
          const createdDate = new Date(task.createdAt);
          activities.push({
            type: 'assigned',
            message: `Task "${task.title}" was created`,
            time: getTimeAgo(createdDate)
          });
        }
        
        if (task.status === 'done' && task.updatedAt) {
          const completedDate = new Date(task.updatedAt);
          activities.push({
            type: 'completed',
            message: `Task "${task.title}" was completed`,
            time: getTimeAgo(completedDate)
          });
        }
      });
      
      // Sort by most recent first  
      activities.sort((a, b) => {
        // Parse time ago to get approximate dates for sorting
        return 0; // Keep insertion order
      });
      
      activities.slice(0, 10).forEach(activity => {
        const div = document.createElement("div");
        div.className = "activity-item";
        div.innerHTML = `
          <div class="activity-icon activity-${activity.type}">
            ${activity.type === 'assigned' ? '📋' : activity.type === 'completed' ? '✅' : '🔄'}
          </div>
          <div>
            <div style="font-size:0.9rem;">${activity.message}</div>
            <div style="font-size:0.8rem;color:#6b7280;">${activity.time}</div>
          </div>
        `;
        activityList.appendChild(div);
      });
    }
    
    // Helper function to format time ago
    function getTimeAgo(date) {
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
      if (seconds < 604800) return Math.floor(seconds / 86400) + ' days ago';
      return 'a while ago';
    }
    
    // Enhanced assign task functionality
    function getAssignableTasks() {
      return allTasks
        .filter(task => task.status !== 'done')
        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    }

    function assignTask(memberId) {
      const assignModal = document.getElementById("assignModal");
      const taskSelect = document.getElementById("taskSelect");
      const memberSelect = document.getElementById("memberSelect");
      const assignableTasks = getAssignableTasks();

      if (!teamMembers.length) {
        alert('No team members found in database. Ask members to sign up first.');
        return;
      }

      if (!assignableTasks.length) {
        alert('No assignable tasks found. Create tasks first.');
        return;
      }
      
      // Populate task select
      taskSelect.innerHTML = '<option value="">Select a task...</option>';
      assignableTasks.forEach(task => {
        const option = document.createElement("option");
        option.value = task._id;
        option.textContent = `${task.title} (${task.projectName || 'Project'})`;
        taskSelect.appendChild(option);
      });
      
      // Populate member select
      memberSelect.innerHTML = '';
      teamMembers.forEach(member => {
        const option = document.createElement("option");
        option.value = member.id;
        option.selected = member.id === memberId;
        option.textContent = member.name;
        memberSelect.appendChild(option);
      });

      if (!memberSelect.value && teamMembers.length > 0) {
        memberSelect.value = teamMembers[0].id;
      }

      document.getElementById('startDate').value = '';
      document.getElementById('dueDate').value = '';
      
      assignModal.style.display = "flex";
    }
    
    function viewMemberTasks(memberId) {
      const member = teamMembers.find(m => m.id === memberId);
      const memberTasks = allTasks.filter(t => {
        const assignedTo = t.assignedTo ? (t.assignedTo._id || t.assignedTo) : null;
        return String(assignedTo || '') === String(memberId);
      });

      let html = '';
      if (memberTasks.length === 0) {
        html += '<p>No tasks assigned to this member.</p>';
      } else {
        html += '<ul style="list-style:none;padding:0;">';
        memberTasks.forEach(task => {
          const statusColor = task.status === 'done' ? '#10b981' : task.status === 'inprogress' ? '#f59e0b' : '#6b7280';
          html += `
            <li style="padding:12px 0;border-bottom:1px solid #e5e7eb;">
              <strong>${task.title}</strong><br/>
              <span style="color:${statusColor};font-weight:600;">${task.status.toUpperCase()}</span>
              ${task.priority ? ` • Priority: ${task.priority}` : ''}
            </li>
          `;
        });
        html += '</ul>';
      }

      document.getElementById('memberTasksTitle').textContent = member ? `${member.name}'s Tasks` : 'Member Tasks';
      document.getElementById('memberTasksContent').innerHTML = html;
      document.getElementById('memberTasksModal').style.display = 'flex';
    }

    function closeMemberTasksModal() {
      document.getElementById('memberTasksModal').style.display = 'none';
    }

    function renderInvites() {
      const inviteList = document.getElementById('inviteList');
      if (!inviteList) return;
      inviteList.innerHTML = '<p style="color:#64748b;margin:0;">Member invitations are not implemented yet. Use the real project membership flow after a teammate has signed up.</p>';
    }
    
    function openBulkAssignModal() {
      const assignModal = document.getElementById("assignModal");
      const taskSelect = document.getElementById("taskSelect");
      const memberSelect = document.getElementById("memberSelect");
      const assignableTasks = getAssignableTasks();

      if (!teamMembers.length) {
        alert('No team members found in database. Ask members to sign up first.');
        return;
      }

      if (!assignableTasks.length) {
        alert('No assignable tasks found. Create tasks first.');
        return;
      }
      
      // Populate task select - allow multiple (but this is single select, so just populate)
      taskSelect.innerHTML = '<option value="">Select a task...</option>';
      assignableTasks.forEach(task => {
        const option = document.createElement("option");
        option.value = task._id;
        option.textContent = `${task.title} (${task.projectName || 'Project'})`;
        taskSelect.appendChild(option);
      });
      
      // Populate member select
      memberSelect.innerHTML = '';
      teamMembers.forEach(member => {
        const option = document.createElement("option");
        option.value = member.id;
        option.textContent = member.name;
        memberSelect.appendChild(option);
      });

      if (teamMembers.length > 0) {
        memberSelect.value = teamMembers[0].id;
      }

      document.getElementById('startDate').value = '';
      document.getElementById('dueDate').value = '';
      
      assignModal.style.display = "flex";
    }
    
    function closeAssignModal() {
      const assignModal = document.getElementById("assignModal");
      assignModal.style.display = "none";
    }
    
    // Enhanced assign task functionality
    document.getElementById("assignTaskForm").onsubmit = async function(e) {
      e.preventDefault();
      const taskId = document.getElementById("taskSelect").value;
      const memberId = document.getElementById("memberSelect").value;
      const priority = document.querySelector(".priority-btn.active").dataset.priority;
      const startDate = document.getElementById("startDate").value;
      const dueDate = document.getElementById("dueDate").value;

      if (!taskId || !memberId) {
        alert('Please select both task and team member.');
        return;
      }
      
      try {
        // Find the task in our loaded data
        const task = allTasks.find(t => t._id === taskId);
        if (!task) {
          alert("Task not found");
          return;
        }
        
        const member = teamMembers.find(m => String(m.id) === String(memberId));
        if (!member) {
          alert('Selected member not found. Refresh and try again.');
          return;
        }

        if (startDate && dueDate && new Date(startDate) > new Date(dueDate)) {
          alert('Start date cannot be after due date.');
          return;
        }
        
        await updateTask(
          taskId,
          task.title,
          task.description || '',
          memberId,
          priority,
          dueDate || task.dueDate || null,
          task.status,
          startDate || task.startDate || null
        );
        
        alert(`Assigned task "${task.title}" to ${member.name}.`);
        closeAssignModal();
        
        // Reload team data to reflect changes
        await loadTeamData();
      } catch (error) {
        console.error('Error assigning task:', error);
        alert('Error assigning task: ' + error.message);
      }
    };
    
    // Add Member Button Handler
    document.getElementById("addMemberBtn").onclick = function() {
      alert('Member invitations are not implemented yet. Use the project membership flow after the user has signed up.');
    };
    
    // Priority selector
    document.querySelectorAll('.priority-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      const teamGrid = document.getElementById('teamGrid');
      teamGrid.addEventListener('click', (event) => {
        const assignBtn = event.target.closest('.assign-task-btn');
        if (assignBtn) {
          assignTask(assignBtn.dataset.memberId);
          return;
        }

        const viewBtn = event.target.closest('.view-tasks-btn');
        if (viewBtn) {
          viewMemberTasks(viewBtn.dataset.memberId);
        }
      });

      const assignModal = document.getElementById('assignModal');
      assignModal.addEventListener('click', (event) => {
        if (event.target === assignModal) {
          closeAssignModal();
        }
      });

      loadTeamData();
      renderInvites();
    });
  </script>
</body>
</html>
