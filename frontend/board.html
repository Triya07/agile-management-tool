<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 50%, #ccfdf7 100%); 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #083344; 
    }
    .main-container { 
      display: flex; 
      min-height: 100vh; 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
    }
    #main-content { 
      flex: 1; 
      padding: 32px 40px; 
      background: transparent;
    }
    .kanban-title {
      background: linear-gradient(135deg, #76C893, #52B69A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 2rem;
    }
    .column {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 260px;
      padding: 0 0 18px 0;
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    .column-title {
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #52B69A, #34A0A4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 18px 18px 10px 18px;
      border-bottom: 2px solid rgba(118, 200, 147, 0.2);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }
    .task-card {
      background: linear-gradient(135deg, rgba(118, 200, 147, 0.05), rgba(82, 182, 154, 0.02));
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      color: #083344;
      box-shadow: 0 2px 8px rgba(8, 51, 68, 0.06);
      cursor: grab;
      transition: all 0.3s;
      border-left: 4px solid #76C893;
    }
    .task-card:hover {
      box-shadow: 0 4px 15px rgba(8, 51, 68, 0.12);
      transform: translateY(-1px);
    }
    .btn {
      background: linear-gradient(135deg, #76C893, #52B69A);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #52B69A, #34A0A4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 182, 154, 0.25);
    }
    .modal-content h3 {
      background: linear-gradient(135deg, #76C893, #52B69A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>


  <!-- Top Navigation Bar -->
  <!-- <header>
    Agile Management Tool
  </header> -->

  <div class="main-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#D9ED92,#76C893,#34A0A4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FlowBoard</span>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-btn active" id="nav-board" onclick="navigateTo('kanban-board.html')">Kanban Board</button>
        <button class="sidebar-btn" id="nav-projects" onclick="navigateTo('projects.html')">Projects</button>
        <button class="sidebar-btn" id="nav-dashboard" onclick="navigateTo('dashboard.html')">Dashboard</button>
        <button class="sidebar-btn" onclick="navigateTo('sprint.html')">Sprints</button>
        <button class="sidebar-btn" onclick="navigateTo('team.html')">Team</button>
        <button class="sidebar-btn" onclick="navigateTo('user-profile.html')">Profile</button>
        <button class="sidebar-btn" id="nav-settings" onclick="navigateTo('settings.html')">Settings</button>
        <button class="sidebar-btn" onclick="logout()">Logout</button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
      <div class="topbar-ui">
        <h2 class="kanban-title">Kanban Board</h2>
        <div class="topbar-actions-vertical">
          <button class="user-avatar-btn" title="User Profile">
            <img src="img/user.png" alt="User" class="user-avatar">
          </button>
          <div class="search-and-task">
            <div class="search-bar">
              <input type="text" id="searchInput" placeholder="Search tasks/projects...">
              <span class="search-icon">🔍</span>
            </div>
            <div class="task-input fade-in">
              <input type="text" id="taskInput" placeholder="Enter a new task...">
              <button class="btn" id="addBtn">Add Task</button>
            </div>
          </div>
        </div>
      </div>

      <div class="board fade-in">
        <div class="column">
          <div class="column-title">To Do</div>
          <div id="todo" class="column-tasks">
            <div class="placeholder">
              <span class="add-task-hint" data-target="todo">Add task...</span>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="column-title">In Progress</div>
          <div id="inprogress" class="column-tasks">
            <div class="placeholder">
              <span class="add-task-hint" data-target="inprogress">Add task...</span>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="column-title">Done</div>
          <div id="done" class="column-tasks">
            <div class="placeholder">
              <span class="add-task-hint" data-target="done">Add task...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Detail Popup (MODAL) -->

  <!-- Task Detail Modal -->
  <div class="modal" id="taskModal" style="display:none;">
    <div class="modal-content fade-in" style="border-radius: 18px; box-shadow: 0 8px 32px rgba(80,130,255,0.18); background: #fff; padding: 32px 28px; min-width: 340px;">
      <h3 id="modalTitle" style="color: #4f8cff; font-size: 1.3rem; font-weight: 600;">Task</h3>
      <label for="descInput" style="font-weight: 500; color: #555;">Description</label>
      <textarea id="descInput" rows="2" style="width:100%; border-radius:8px; padding:8px; margin-bottom:12px; font-size:1rem;"></textarea>
      <label for="timelineInput" style="font-weight: 500; color: #555;">Timeline</label>
      <input type="date" id="timelineInput" style="width:100%; border-radius:8px; padding:8px; margin-bottom:18px; font-size:1rem;">
      <label for="statusSelect" style="font-weight: 500; color: #555;">Status</label>
      <select id="statusSelect" style="margin-bottom: 18px; border-radius: 8px; padding: 8px 12px; font-size: 1rem; width:100%;">
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button class="btn" id="saveTask">Save</button>
        <button class="btn" id="moveForwardBtn" style="background: #ffe082; color: #4f8cff;">Move Forward</button>
        <button class="btn" id="deleteTaskBtn" style="background: #fc5c7d; color: #fff;">Delete</button>
        <button class="btn" id="closeModal" style="background: #eee; color: #4f8cff;">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Global navigation and utility functions
    function navigateTo(page) {
      window.location.href = page;
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
