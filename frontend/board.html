<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Top Navigation Bar -->
  <!-- <header>
    Agile Management Tool
  </header> -->

  <div class="main-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
   <!-- Logo -->
<div class="sidebar-logo">
  <img src="img/logo.png" alt="FlowBoard Logo">
  <!-- <span>FlowBoard</span> -->
</div>




      <nav class="sidebar-nav">
        <button class="sidebar-btn active" id="nav-board">Kanban Board</button>
        <button class="sidebar-btn" id="nav-projects">Projects</button>
        <button class="sidebar-btn" id="nav-dashboard">Dashboard</button>
        <button class="sidebar-btn" id="nav-settings">Settings</button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
      <div class="topbar-ui">
        <h2 class="kanban-title">Kanban Board</h2>
        <div class="topbar-actions-vertical">
          <button class="user-avatar-btn" title="User Profile">
            <img src="img/user.png" alt="User" class="user-avatar">
          </button>
          <div class="search-and-task">
            <div class="search-bar">
              <input type="text" id="searchInput" placeholder="Search tasks/projects...">
              <span class="search-icon">🔍</span>
            </div>
            <div class="task-input fade-in">
              <input type="text" id="taskInput" placeholder="Enter a new task...">
              <button class="btn" id="addBtn">Add Task</button>
            </div>
          </div>
        </div>
      </div>

      <div class="board fade-in">
        <div class="column">
          <div class="column-title">To Do</div>
          <div id="todo" class="column-tasks">
            <div class="placeholder">
              <span class="add-task-hint" data-target="todo">Add task...</span>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="column-title">In Progress</div>
          <div id="inprogress" class="column-tasks">
            <div class="placeholder">
              <span class="add-task-hint" data-target="inprogress">Add task...</span>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="column-title">Done</div>
          <div id="done" class="column-tasks">
            <div class="placeholder">
              <span class="add-task-hint" data-target="done">Add task...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Detail Popup (MODAL) -->

  <!-- Task Detail Modal -->
  <div class="modal" id="taskModal" style="display:none;">
    <div class="modal-content fade-in" style="border-radius: 18px; box-shadow: 0 8px 32px rgba(80,130,255,0.18); background: #fff; padding: 32px 28px; min-width: 340px;">
      <h3 id="modalTitle" style="color: #4f8cff; font-size: 1.3rem; font-weight: 600;">Task</h3>
      <label for="descInput" style="font-weight: 500; color: #555;">Description</label>
      <textarea id="descInput" rows="2" style="width:100%; border-radius:8px; padding:8px; margin-bottom:12px; font-size:1rem;"></textarea>
      <label for="timelineInput" style="font-weight: 500; color: #555;">Timeline</label>
      <input type="date" id="timelineInput" style="width:100%; border-radius:8px; padding:8px; margin-bottom:18px; font-size:1rem;">
      <label for="statusSelect" style="font-weight: 500; color: #555;">Status</label>
      <select id="statusSelect" style="margin-bottom: 18px; border-radius: 8px; padding: 8px 12px; font-size: 1rem; width:100%;">
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button class="btn" id="saveTask">Save</button>
        <button class="btn" id="moveForwardBtn" style="background: #ffe082; color: #4f8cff;">Move Forward</button>
        <button class="btn" id="deleteTaskBtn" style="background: #fc5c7d; color: #fff;">Delete</button>
        <button class="btn" id="closeModal" style="background: #eee; color: #4f8cff;">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
