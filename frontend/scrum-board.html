<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrum Board | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #083344;
      font-size: 16px;
      margin: 0;
      padding: 0;
    }
    .main-container {
      display: flex;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
    }
    #main-content {
      flex: 1;
      padding: 32px 40px 32px 40px;
      background: transparent;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .kanban-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #0891b2, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }
    .board {
      display: flex;
      gap: 28px;
      margin-bottom: 36px;
    }
    .column {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 260px;
      padding: 0 0 18px 0;
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    .column-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0e7490;
      padding: 18px 18px 10px 18px;
      border-bottom: 2px solid rgba(6, 182, 212, 0.2);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }
    .column-tasks {
      flex: 1;
      padding: 0 18px;
      min-height: 60px;
    }
    .task-card {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.05), rgba(34, 197, 94, 0.02));
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      color: #083344;
      box-shadow: 0 2px 8px rgba(8, 51, 68, 0.06);
      cursor: grab;
      transition: all 0.3s;
      border-left: 3px solid #06b6d4;
    }
    .task-card:hover {
      box-shadow: 0 4px 15px rgba(8, 51, 68, 0.12);
      transform: translateY(-1px);
    }
    .btn {
      background: linear-gradient(135deg, #0891b2, #22c55e);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #22c55e, #059669);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.25);
    }
    /* ...existing code for sidebar, nav, etc... */
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Sidebar (reuse your existing sidebar) -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#3182ce,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FlowBoard</span>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" id="nav-board">Kanban Board</button>
        <button class="sidebar-btn" id="nav-projects">Projects</button>
        <button class="sidebar-btn" id="nav-dashboard">Dashboard</button>
        <button class="sidebar-btn" id="nav-sprints">Sprints</button>
        <button class="sidebar-btn" id="nav-settings">Settings</button>
      </nav>
    </aside>

    <main id="main-content">
      <div class="topbar-ui">
        <h2 class="kanban-title">Scrum Board</h2>
        <div class="topbar-actions-vertical">
          <button class="btn" onclick="window.location.href='sprint.html'" style="margin-right:16px;background:#e2e8f0;color:#222;">Change Sprint</button>
          <button class="user-avatar-btn" title="User Profile">
            <img src="img/user.png" alt="User" class="user-avatar">
          </button>
        </div>
      </div>

      <!-- Sprint Selection Notice -->
      <div id="sprintNotice" style="display:none;background:#fff3cd;color:#856404;padding:16px 20px;border-radius:8px;margin-bottom:20px;font-size:1.05rem;">
        No active sprint selected for this project. Please select or create a sprint first.
      </div>

      <!-- Add Task Button -->
      <div id="addTaskBtnRow" style="display:flex;justify-content:flex-end;margin-bottom:18px;">
        <button class="btn" id="openAddTaskModal" style="min-width:120px;">+ Add Task</button>
      </div>

      <!-- Enhanced Add Task Modal (Asana-style) -->
      <div id="addTaskModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(2px);">
        <div style="background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:600px;max-width:90vw;max-height:90vh;overflow-y:auto;">
          <!-- Modal Header -->
          <div style="padding:20px 24px 16px 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:between;">
            <div style="display:flex;align-items:center;gap:12px;flex:1;">
              <div style="width:20px;height:20px;border:2px solid #e5e7eb;border-radius:4px;cursor:pointer;" onclick="markComplete()"></div>
              <input type="text" id="taskTitleInput" placeholder="Task name" style="border:none;font-size:1.2rem;font-weight:500;flex:1;outline:none;" required>
            </div>
            <button onclick="closeTaskModal()" style="border:none;background:none;font-size:1.5rem;color:#6b7280;cursor:pointer;padding:4px;">×</button>
          </div>
          
          <!-- Modal Body -->
          <div style="padding:0;">
            <form id="addTaskForm">
              <!-- Assignee Section -->
              <div style="padding:16px 24px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;">
                <div style="width:120px;font-size:0.9rem;color:#6b7280;font-weight:500;">Assignee</div>
                <select id="taskAssigneeSelect" style="border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;flex:1;background:#fff;">
                  <option value="">Recently assigned</option>
                </select>
              </div>
              
              <!-- Due Date Section -->
              <div style="padding:16px 24px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;">
                <div style="width:120px;font-size:0.9rem;color:#6b7280;font-weight:500;">Due date</div>
                <input type="date" id="taskDueDateInput" style="border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;flex:1;">
              </div>
              
              <!-- Projects Section -->
              <div style="padding:16px 24px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;">
                <div style="width:120px;font-size:0.9rem;color:#6b7280;font-weight:500;">Projects</div>
                <div style="display:flex;align-items:center;gap:8px;flex:1;">
                  <div id="selectedProject" style="background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:4px;font-size:0.85rem;font-weight:500;"></div>
                  <select id="taskStatusInput" style="border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;font-size:0.85rem;">
                    <option value="todo">To do</option>
                    <option value="inprogress">In Progress</option>
                    <option value="done">Done</option>
                  </select>
                </div>
              </div>
              
              <!-- Dependencies Section -->
              <div style="padding:16px 24px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;">
                <div style="width:120px;font-size:0.9rem;color:#6b7280;font-weight:500;">Dependencies</div>
                <button type="button" style="border:none;background:none;color:#3b82f6;font-size:0.9rem;cursor:pointer;">Add dependencies</button>
              </div>
              
              <!-- Fields Section -->
              <div style="padding:16px 24px;border-bottom:1px solid #f3f4f6;">
                <div style="font-size:0.9rem;color:#6b7280;font-weight:500;margin-bottom:12px;">Fields</div>
                <div style="display:flex;gap:16px;">
                  <div style="flex:1;">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                      <div style="width:8px;height:8px;border-radius:50%;background:#6b7280;"></div>
                      <span style="font-size:0.85rem;color:#6b7280;">Priority</span>
                    </div>
                    <select id="taskPriorityInput" style="width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;background:#fff;">
                      <option value="low">Low</option>
                      <option value="medium" selected>Medium</option>
                      <option value="high">High</option>
                    </select>
                  </div>
                  <div style="flex:1;">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                      <div style="width:8px;height:8px;border-radius:50%;background:#10b981;"></div>
                      <span style="font-size:0.85rem;color:#6b7280;">Status</span>
                    </div>
                    <div id="statusDisplay" style="padding:8px 12px;background:#dcfce7;color:#166534;border-radius:6px;font-size:0.85rem;font-weight:500;">On track</div>
                  </div>
                </div>
              </div>
              
              <!-- Description Section -->
              <div style="padding:16px 24px;">
                <div style="font-size:0.9rem;color:#6b7280;font-weight:500;margin-bottom:8px;">Description</div>
                <textarea id="taskDescriptionInput" placeholder="What is this task about?" style="width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:12px;min-height:80px;resize:vertical;font-family:inherit;" rows="3"></textarea>
              </div>
              
              <!-- Comments Section -->
              <div style="padding:0 24px 20px 24px;">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                  <div id="userAvatar" style="width:32px;height:32px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;color:white;font-weight:500;font-size:0.9rem;">
                    U
                  </div>
                  <textarea id="taskCommentInput" placeholder="Add a comment" style="flex:1;border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;font-family:inherit;resize:none;" rows="1"></textarea>
                </div>
              </div>
              
              <!-- Submit Button -->
              <div style="padding:0 24px 24px 24px;display:flex;justify-content:flex-end;gap:12px;">
                <button type="button" onclick="closeTaskModal()" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:6px;cursor:pointer;">Cancel</button>
                <button type="submit" style="padding:8px 16px;border:none;background:#3b82f6;color:white;border-radius:6px;cursor:pointer;font-weight:500;">Create task</button>
              </div>
              
              <!-- Collaborators -->
              <div style="padding:0 24px 24px 24px;border-top:1px solid #f3f4f6;padding-top:16px;">
                <div style="display:flex;align-items:center;gap:12px;">
                  <span style="font-size:0.85rem;color:#6b7280;">Collaborators</span>
                  <div style="display:flex;align-items:center;gap:4px;" id="collaboratorsList">
                    <div style="width:24px;height:24px;border-radius:50%;background:#ec4899;display:flex;align-items:center;justify-content:center;color:white;font-size:0.7rem;">M</div>
                  </div>
                  <button type="button" style="width:24px;height:24px;border:1px dashed #d1d5db;border-radius:50%;background:none;color:#6b7280;cursor:pointer;font-size:0.8rem;">+</button>
                  <button type="button" style="border:none;background:none;color:#6b7280;font-size:1.1rem;cursor:pointer;margin-left:auto;">⚡</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Scrum Board -->
      <div class="board fade-in" id="scrumBoard">
        <div class="column">
          <div class="column-title">To Do</div>
          <div id="todo" class="column-tasks"></div>
        </div>
        <div class="column">
          <div class="column-title">In Progress</div>
          <div id="inprogress" class="column-tasks"></div>
        </div>
        <div class="column">
          <div class="column-title">Done</div>
          <div id="done" class="column-tasks"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="scrum-board.js"></script>
</body>
</html>
