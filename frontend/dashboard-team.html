<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Member Dashboard | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f7f8fa; font-family: 'Segoe UI', Arial, sans-serif; color: #222; }
    .main-container { display: flex; min-height: 100vh; }
    #main-content { flex: 1; padding: 32px 40px; }
    .dashboard-section { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 24px; margin-bottom: 28px; }
    .dashboard-title { font-size: 2rem; font-weight: 600; margin-bottom: 18px; }
    .task-group { margin-bottom: 24px; }
    .task-group-title { font-size: 1.15rem; font-weight: 500; margin-bottom: 10px; }
    .task-card { background: #f7fafc; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: space-between; }
    .task-title { font-weight: 500; }
    .status-badge { border-radius: 6px; padding: 2px 10px; font-size: 0.95rem; margin-right: 10px; }
    .status-todo { background: #fef9c3; color: #b45309; }
    .status-inprogress { background: #dbeafe; color: #2563eb; }
    .status-done { background: #bbf7d0; color: #15803d; }
    .due-today { background: #fee2e2; color: #b91c1c; border-radius: 6px; padding: 2px 8px; font-size: 0.95rem; margin-left: 10px; }
    .btn { background: #3182ce; color: #fff; border: none; border-radius: 7px; padding: 7px 16px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    /* Modal */
    #taskModal { display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.18);z-index:1000;align-items:center;justify-content:center; }
    #taskModal .modal-content { background:#fff;padding:28px 24px 20px 24px;border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,0.12);width:340px;max-width:90vw;position:relative; }
    #taskModal label { font-size:1rem; }
    #taskModal select, #taskModal textarea { width:100%;margin-bottom:12px;padding:8px 10px;border-radius:7px;border:1px solid #e2e8f0;font-size:1rem;background:#f7fafc; }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <!-- ...existing code... -->
    </aside>
    <main id="main-content">
      <div class="dashboard-section">
        <div class="dashboard-title">My Tasks</div>
        <div id="tasksByStatus"></div>
      </div>
    </main>
  </div>
  <!-- Task Modal -->
  <div id="taskModal">
    <div class="modal-content">
      <h3 style="margin-top:0;margin-bottom:14px;font-size:1.15rem;font-weight:600;color:#1a202c;">Task Details</h3>
      <div id="modalTaskTitle" style="font-weight:500;margin-bottom:8px;"></div>
      <div id="modalTaskDue" style="font-size:0.98rem;color:#666;margin-bottom:8px;"></div>
      <form id="updateTaskForm">
        <label>Status</label>
        <select id="modalTaskStatus">
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <label>Description</label>
        <textarea id="modalTaskDesc" rows="3" readonly></textarea>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" class="btn" id="closeTaskModal" style="background:#e2e8f0;color:#222;">Close</button>
          <button type="submit" class="btn">Update</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    // Simulate logged-in user (replace with real auth in production)
    const currentUser = localStorage.getItem("currentUser") || "worker1";

    // Load tasks assigned to this user
    function getUserTasks() {
      return (JSON.parse(localStorage.getItem("tasks")) || []).filter(
        t => t.assignee === currentUser
      );
    }

    function groupTasksByStatus(tasks) {
      return {
        todo: tasks.filter(t => t.status === "todo"),
        inprogress: tasks.filter(t => t.status === "inprogress"),
        done: tasks.filter(t => t.status === "done")
      };
    }

    function isDueToday(task) {
      if (!task.dueDate) return false;
      const today = new Date().toISOString().slice(0,10);
      return task.dueDate === today;
    }

    function renderTasks() {
      const tasks = getUserTasks();
      const grouped = groupTasksByStatus(tasks);
      const container = document.getElementById("tasksByStatus");
      container.innerHTML = "";

      ["todo", "inprogress", "done"].forEach(status => {
        if (grouped[status].length === 0) return;
        const groupDiv = document.createElement("div");
        groupDiv.className = "task-group";
        groupDiv.innerHTML = `<div class="task-group-title">${status === "todo" ? "To Do" : status === "inprogress" ? "In Progress" : "Done"}</div>`;
        grouped[status].forEach(task => {
          const card = document.createElement("div");
          card.className = "task-card";
          card.innerHTML = `
            <span>
              <span class="status-badge status-${status}">${status === "todo" ? "To Do" : status === "inprogress" ? "In Progress" : "Done"}</span>
              <span class="task-title">${task.title}</span>
              ${isDueToday(task) ? '<span class="due-today">Due Today</span>' : ""}
            </span>
            <button class="btn" data-id="${task.id}">View</button>
          `;
          card.querySelector("button").onclick = () => openTaskModal(task.id);
          groupDiv.appendChild(card);
        });
        container.appendChild(groupDiv);
      });
    }

    // --- Task Modal Logic ---
    let modalTask = null;
    function openTaskModal(taskId) {
      const tasks = getUserTasks();
      modalTask = tasks.find(t => t.id == taskId);
      if (!modalTask) return;
      document.getElementById("modalTaskTitle").textContent = modalTask.title;
      document.getElementById("modalTaskDue").textContent = modalTask.dueDate ? "Due: " + modalTask.dueDate : "";
      document.getElementById("modalTaskStatus").value = modalTask.status;
      document.getElementById("modalTaskDesc").value = modalTask.description || "";
      document.getElementById("taskModal").style.display = "flex";
    }
    document.getElementById("closeTaskModal").onclick = function() {
      document.getElementById("taskModal").style.display = "none";
    };
    document.getElementById("updateTaskForm").onsubmit = function(e) {
      e.preventDefault();
      if (!modalTask) return;
      const newStatus = document.getElementById("modalTaskStatus").value;
      let allTasks = JSON.parse(localStorage.getItem("tasks")) || [];
      const idx = allTasks.findIndex(t => t.id == modalTask.id);
      if (idx !== -1) {
        allTasks[idx].status = newStatus;
        localStorage.setItem("tasks", JSON.stringify(allTasks));
      }
      document.getElementById("taskModal").style.display = "none";
      renderTasks();
    };

    // --- Initial render ---
    renderTasks();
  </script>
</body>
</html>
