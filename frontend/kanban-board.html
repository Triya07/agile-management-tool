<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --sidebar-width: 300px;
    }
    
    body {
      background: linear-gradient(135deg, #F7FCEB 0%, #ECFDF0 50%, #D1FAE5 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #083344;
      margin: 0;
      padding: 0;
    }
    
    .main-container {
      display: flex;
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      transition: margin-left 0.3s ease, width 0.3s ease;
    }
    
    #main-content {
      flex: 1;
      padding: 32px 40px;
      background: transparent;
    }
    
    .kanban-title {
      background: linear-gradient(135deg, #76C893, #52B69A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 32px;
    }
    
    .board {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding-bottom: 20px;
    }
    
    .column {
      min-width: 300px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(118, 200, 147, 0.2);
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08);
    }
    
    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .column-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #34A0A4;
    }
    
    .task-count {
      background: rgba(118, 200, 147, 0.2);
      color: #34A0A4;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    
    .task-card {
      background: linear-gradient(135deg, rgba(118, 200, 147, 0.05), rgba(82, 182, 154, 0.02));
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #76C893;
      box-shadow: 0 2px 8px rgba(8, 51, 68, 0.06);
      cursor: grab;
      transition: all 0.3s;
    }
    
    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(8, 51, 68, 0.12);
    }
    
    .task-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #083344;
    }
    
    .task-description {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 12px;
    }
    
    .task-assignee {
      font-size: 0.8rem;
      color: #34A0A4;
      font-weight: 500;
    }
    
    .add-task-btn {
      background: linear-gradient(135deg, #76C893, #52B69A);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 12px;
    }
    
    .add-task-btn:hover {
      background: linear-gradient(135deg, #52B69A, #34A0A4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;color:#D9ED92;">FlowBoard</span>
        <button class="sidebar-resize-btn" id="sidebarResizeBtn" title="Toggle sidebar size">⟷</button>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn active">Kanban Board</button>
        <button class="sidebar-btn" onclick="navigateTo('projects.html')">Projects</button>
        <button class="sidebar-btn" onclick="navigateTo('dashboard.html')">Dashboard</button>
        <button class="sidebar-btn" onclick="navigateTo('sprint.html')">Sprints</button>
        <button class="sidebar-btn" onclick="navigateTo('settings.html')">Settings</button>
      </nav>
    </aside>

    <main id="main-content">
      <h1 class="kanban-title">Kanban Board</h1>
      
      <div class="board">
        <!-- Board will be populated dynamically -->
      </div>
    </main>
  </div>

  <script src="api.js"></script>
  <script src="kanban-board.js"></script>
</body>
</html>
