<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #D9ED92 0%, #B5E48C 25%, #99D98C 50%, #76C893 75%, #52B69A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    }
    .signup-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(26, 117, 159, 0.3);
      padding: 40px 36px 32px 36px;
      min-width: 340px;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(118, 200, 147, 0.2);
    }
    .signup-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .signup-logo-text {
      font-size: 2.2rem;
      font-weight: 900;
      font-family: 'Segoe UI', 'Arial Black', sans-serif;
      background: linear-gradient(135deg, #76C893, #52B69A, #34A0A4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .signup-title {
      font-size: 1.4rem;
      font-weight: 600;
      background: linear-gradient(135deg, #34A0A4, #168AAD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 18px;
    }
    .signup-form input {
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #76C893;
      font-size: 1rem;
      outline: none;
      background: rgba(118, 200, 147, 0.05);
      transition: all 0.3s;
      color: #083344;
    }
    .signup-form input:focus {
      border: 2px solid #52B69A;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(82, 182, 154, 0.2);
    }
    .role-select {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 10px;
    }
    .role-btn {
      padding: 12px 28px;
      border-radius: 25px;
      border: 2px solid #76C893;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(118, 200, 147, 0.1);
      color: #34A0A4;
      transition: all 0.3s;
    }
    .role-btn.active, .role-btn:focus {
      background: linear-gradient(135deg, #76C893, #52B69A);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(118, 200, 147, 0.3);
    }
    .signup-btn {
      background: linear-gradient(135deg, #76C893 0%, #52B69A 50%, #34A0A4 100%);
      color: #fff;
      border: none;
      padding: 14px 0;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 8px;
      box-shadow: 0 6px 20px rgba(118, 200, 147, 0.25);
      cursor: pointer;
      transition: all 0.3s;
    }
    .signup-btn:hover {
      background: linear-gradient(135deg, #52B69A 0%, #34A0A4 100%);
      box-shadow: 0 8px 25px rgba(52, 160, 164, 0.35);
      transform: translateY(-2px);
    }
    .login-link {
      margin-top: 18px;
      font-size: 1rem;
      color: #34A0A4;
      text-decoration: underline;
      cursor: pointer;
      display: block;
      transition: color 0.3s;
    }
    .login-link:hover {
      color: #76C893;
    }
  </style>
</head>
<body>
  <div class="signup-container fade-in">
    <div class="signup-logo">
      <span class="signup-logo-text">FlowBoard</span>
    </div>
    <div class="signup-title">Create Account</div>
    <form class="signup-form">
      <input type="text" placeholder="Username" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <div class="role-select">
        <button type="button" class="role-btn active" id="role-manager">Manager</button>
        <button type="button" class="role-btn" id="role-worker">Worker</button>
      </div>
      <button type="submit" class="signup-btn">Sign Up</button>
    </form>
    <span class="login-link" onclick="window.location.href='login.html'">Already have an account? Login</span>
  </div>
  <script>
    // Role selection toggle
    const managerBtn = document.getElementById('role-manager');
    const workerBtn = document.getElementById('role-worker');
    let selectedRole = 'manager';
    managerBtn.onclick = function() {
      managerBtn.classList.add('active');
      workerBtn.classList.remove('active');
      selectedRole = 'manager';
    };
    workerBtn.onclick = function() {
      workerBtn.classList.add('active');
      managerBtn.classList.remove('active');
      selectedRole = 'worker';
    };
    // Handle signup (demo only)
    document.querySelector('.signup-form').onsubmit = function(e) {
      e.preventDefault();
      // Save role to localStorage for demo
      localStorage.setItem('userRole', selectedRole);
      window.location.href = 'projects.html';
    };
  </script>
</body>
</html>
