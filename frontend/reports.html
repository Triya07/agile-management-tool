<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 50%, #ccfdf7 100%); 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #083344; 
    }
    .main-container { 
      display: flex; 
      min-height: 100vh; 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
    }
    #main-content { 
      flex: 1; 
      padding: 32px 40px; 
      background: transparent;
    }
    .report-section { 
      background: rgba(255, 255, 255, 0.8); 
      border-radius: 15px; 
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08); 
      padding: 28px; 
      margin-bottom: 24px; 
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    .report-section h2 {
      background: linear-gradient(135deg, #0891b2, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 2.2rem;
    }
    .chart-container { 
      min-height: 220px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.05), rgba(34, 197, 94, 0.02)); 
      border-radius: 12px; 
      margin: 20px 0; 
      border: 1px solid rgba(6, 182, 212, 0.1);
      padding: 18px;
    }
    .chart-container h3 {
      color: #0e7490;
    }
    .chart-container p {
      color: #0e7490;
      opacity: 0.7;
    }
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin-bottom: 24px;
    }
    .stat-card { 
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(34, 197, 94, 0.05)); 
      padding: 24px; 
      border-radius: 12px; 
      text-align: center; 
      border: 1px solid rgba(6, 182, 212, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(8, 51, 68, 0.12);
    }
    .stat-card h3 {
      color: #0e7490;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .stat-card div {
      background: linear-gradient(135deg, #0891b2, #22c55e) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      font-weight: 700 !important;
    }
    .chart-title {
      margin: 0 0 12px 0;
      color: #0e7490;
      font-size: 1.1rem;
      font-weight: 700;
    }
    pre.chart-text {
      margin: 0;
      font-family: Consolas, monospace;
      font-size: 0.82rem;
      color: #0b5f71;
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .project-picker {
      margin: 0 0 14px 0;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .project-picker select {
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(6, 182, 212, 0.25);
      min-width: 240px;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#0891b2,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FlowBoard</span>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" onclick="navigateTo('dashboard.html')">Dashboard</button>
        <button class="sidebar-btn" onclick="navigateTo('projects.html')">Projects</button>
        <button class="sidebar-btn" onclick="navigateTo('backlog.html')">Backlog</button>
        <button class="sidebar-btn" onclick="navigateTo('kanban-board.html')">Kanban Board</button>
        <button class="sidebar-btn" onclick="navigateTo('sprint.html')">Sprint Management</button>
        <button class="sidebar-btn" onclick="navigateTo('scrum-updates.html')">Scrum Updates</button>
        <button class="sidebar-btn" onclick="navigateTo('team.html')">Team</button>
        <button class="sidebar-btn" onclick="navigateTo('user-profile.html')">Profile</button>
        <button class="sidebar-btn active">Reports</button>
        <button class="sidebar-btn" onclick="logout()">Logout</button>
      </nav>
    </aside>
    <main id="main-content">
      <div class="report-section">
        <h2 style="margin-top:0;">Project Reports</h2>

        <div class="project-picker">
          <label for="projectSelect"><strong>Project</strong></label>
          <select id="projectSelect"></select>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Total Tasks</h3>
            <div style="font-size:2rem;color:#3182ce;" id="totalTasks">0</div>
          </div>
          <div class="stat-card">
            <h3>Completed</h3>
            <div style="font-size:2rem;color:#10b981;" id="completedTasks">0</div>
          </div>
          <div class="stat-card">
            <h3>In Progress</h3>
            <div style="font-size:2rem;color:#f59e0b;" id="inProgressTasks">0</div>
          </div>
          <div class="stat-card">
            <h3>Team Velocity</h3>
            <div style="font-size:2rem;color:#8b5cf6;" id="teamVelocity">0 pts</div>
          </div>
          <div class="stat-card">
            <h3>Carry-over Work</h3>
            <div style="font-size:2rem;color:#ef4444;" id="carryOver">0 pts</div>
          </div>
          <div class="stat-card">
            <h3>Backlog Size</h3>
            <div style="font-size:2rem;color:#0ea5e9;" id="backlogItems">0</div>
          </div>
        </div>
        
        <div class="chart-container">
          <div style="width:100%;">
            <h3 class="chart-title">Sprint Burndown (Latest/Active Sprint)</h3>
            <pre class="chart-text" id="burndownChart">No sprint data available.</pre>
          </div>
        </div>

        <div class="chart-container">
          <div style="width:100%;">
            <h3 class="chart-title">Velocity Trend (Completed Sprints)</h3>
            <pre class="chart-text" id="velocityChart">No completed sprint history yet.</pre>
          </div>
        </div>
      </div>
    </main>
  </div>
 
  <script src="api.js"></script>
  <script>
     // AUTH GUARD — paste at top of every protected page
(function() {
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || 'null');
  if (!token || !user) {
    window.location.href = 'login.html';
    return;
  }

  // Role-based protection
  // On manager-only pages (dashboard.html, team.html, reports.html):
  if (user.role !== 'manager') window.location.href = 'dashboard-team.html';

  // On worker-only pages (dashboard-team.html, my-tasks.html):
  // if (user.role !== 'worker') window.location.href = 'dashboard.html';
})();
  
    function renderBarChart(data, labelKey, valueKey, unit = '') {
      if (!Array.isArray(data) || data.length === 0) {
        return 'No data available.';
      }

      const maxValue = Math.max(...data.map(item => Number(item[valueKey] || 0)), 1);
      return data.map(item => {
        const label = String(item[labelKey]).slice(0, 16).padEnd(16, ' ');
        const value = Number(item[valueKey] || 0);
        const barSize = Math.round((value / maxValue) * 24);
        const bar = '█'.repeat(barSize || 1);
        return `${label} | ${bar} ${value}${unit}`;
      }).join('\n');
    }

    async function updateStats(projectId) {
      try {
        const metrics = await getProjectAgileMetrics(projectId);

        document.getElementById('totalTasks').textContent = metrics.overview.totalTasks;
        document.getElementById('completedTasks').textContent = metrics.overview.completedTasks;
        document.getElementById('inProgressTasks').textContent = metrics.overview.inProgressTasks;
        document.getElementById('teamVelocity').textContent = `${metrics.velocity.averageVelocity} pts`;
        document.getElementById('carryOver').textContent = `${metrics.latestSprint ? metrics.latestSprint.carryOverPoints : 0} pts`;
        document.getElementById('backlogItems').textContent = metrics.backlog.totalItems;

        const sprintForBurndown = metrics.activeSprint || metrics.latestSprint;
        const burndownData = sprintForBurndown ? sprintForBurndown.burndown : [];
        const burndownLines = Array.isArray(burndownData)
          ? burndownData.map(day => ({ date: day.date.slice(5), remaining: day.remainingPoints }))
          : [];

        document.getElementById('burndownChart').textContent = renderBarChart(
          burndownLines,
          'date',
          'remaining',
          ' pts'
        );

        const velocityData = (metrics.velocity.history || []).slice(-8).map(item => ({
          sprint: item.sprintName,
          velocity: item.completedPoints
        }));

        document.getElementById('velocityChart').textContent = renderBarChart(
          velocityData,
          'sprint',
          'velocity',
          ' pts'
        );
      } catch (error) {
        console.error('Error loading task stats:', error);
        document.getElementById('burndownChart').textContent = 'Failed to load burndown data.';
        document.getElementById('velocityChart').textContent = 'Failed to load velocity data.';
      }
    }

    async function loadProjectSelector() {
      const projectSelect = document.getElementById('projectSelect');
      const projects = await getProjects();
      const projectList = Array.isArray(projects) ? projects : [];

      if (!projectList.length) {
        projectSelect.innerHTML = '<option value="">No projects</option>';
        return null;
      }

      projectSelect.innerHTML = projectList
        .map(project => `<option value="${project._id}">${project.name}</option>`)
        .join('');

      projectSelect.addEventListener('change', () => updateStats(projectSelect.value));
      return projectSelect.value;
    }
    
    function navigateTo(page) {
      window.location.href = page;
    }
    
    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }
    
    // Call updateStats async on page load
    document.addEventListener('DOMContentLoaded', async () => {
      const initialProjectId = await loadProjectSelector();
      if (initialProjectId) {
        updateStats(initialProjectId);
      }
    });
  </script>
</body>
</html>
