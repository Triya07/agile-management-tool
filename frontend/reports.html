<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 50%, #ccfdf7 100%); 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #083344; 
    }
    .main-container { 
      display: flex; 
      min-height: 100vh; 
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
    }
    #main-content { 
      flex: 1; 
      padding: 32px 40px; 
      background: transparent;
    }
    .report-section { 
      background: rgba(255, 255, 255, 0.8); 
      border-radius: 15px; 
      box-shadow: 0 4px 20px rgba(8, 51, 68, 0.08); 
      padding: 28px; 
      margin-bottom: 24px; 
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    .report-section h2 {
      background: linear-gradient(135deg, #0891b2, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 2.2rem;
    }
    .chart-container { 
      height: 300px; 
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.05), rgba(34, 197, 94, 0.02)); 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin: 20px 0; 
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    .chart-container h3 {
      color: #0e7490;
    }
    .chart-container p {
      color: #0e7490;
      opacity: 0.7;
    }
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin-bottom: 24px;
    }
    .stat-card { 
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(34, 197, 94, 0.05)); 
      padding: 24px; 
      border-radius: 12px; 
      text-align: center; 
      border: 1px solid rgba(6, 182, 212, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(8, 51, 68, 0.12);
    }
    .stat-card h3 {
      color: #0e7490;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .stat-card div {
      background: linear-gradient(135deg, #0891b2, #22c55e) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#0891b2,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FlowBoard</span>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
        <button class="sidebar-btn" onclick="window.location.href='projects.html'">Projects</button>
        <button class="sidebar-btn" onclick="window.location.href='board.html'">Kanban Board</button>
        <button class="sidebar-btn" onclick="window.location.href='sprint.html'">Sprint Management</button>
        <button class="sidebar-btn" onclick="window.location.href='scrum-updates.html'">Scrum Updates</button>
        <button class="sidebar-btn" onclick="window.location.href='team.html'">Team</button>
        <button class="sidebar-btn active">Reports</button>
        <button class="sidebar-btn" onclick="logout()">Logout</button>
      </nav>
    </aside>
    <main id="main-content">
      <div class="report-section">
        <h2 style="margin-top:0;">Project Reports</h2>
        
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Total Tasks</h3>
            <div style="font-size:2rem;color:#3182ce;" id="totalTasks">0</div>
          </div>
          <div class="stat-card">
            <h3>Completed</h3>
            <div style="font-size:2rem;color:#10b981;" id="completedTasks">0</div>
          </div>
          <div class="stat-card">
            <h3>In Progress</h3>
            <div style="font-size:2rem;color:#f59e0b;" id="inProgressTasks">0</div>
          </div>
          <div class="stat-card">
            <h3>Team Velocity</h3>
            <div style="font-size:2rem;color:#8b5cf6;" id="teamVelocity">85%</div>
          </div>
        </div>
        
        <div class="chart-container">
          <div style="text-align:center;">
            <h3>Task Progress Chart</h3>
            <p>Chart visualization would go here</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <script>
    // Manager auth check
    if (localStorage.getItem('userRole') !== 'manager') {
      alert('Access denied. Manager login required.');
      window.location.href = 'login.html';
    }
    
    function updateStats() {
      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      document.getElementById('totalTasks').textContent = tasks.length;
      document.getElementById('completedTasks').textContent = tasks.filter(t => t.status === 'done').length;
      document.getElementById('inProgressTasks').textContent = tasks.filter(t => t.status === 'inprogress').length;
    }
    
    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }
    
    updateStats();
  </script>
</body>
</html>
