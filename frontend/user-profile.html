<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | FlowBoard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 50%, #ccfdf7 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #083344;
      min-height: 100vh;
    }

    .main-container {
      display: flex;
      min-height: 100vh;
    }

    #main-content {
      flex: 1;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0891b2, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(8, 51, 68, 0.12);
      margin-bottom: 30px;
      border: 1px solid rgba(118, 200, 147, 0.2);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 2px solid rgba(118, 200, 147, 0.2);
    }

    .profile-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0891b2, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 4rem;
      font-weight: 900;
      border: 5px solid rgba(118, 200, 147, 0.3);
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 2.2rem;
      color: #083344;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .profile-info .role {
      display: inline-block;
      background: linear-gradient(135deg, #0891b2, #22c55e);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .profile-info .email {
      color: #666;
      font-size: 1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(8, 145, 178, 0.05), rgba(34, 197, 94, 0.05));
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #0891b2;
      text-align: center;
    }

    .stat-card h3 {
      color: #0891b2;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-card p {
      color: #666;
      font-size: 0.95rem;
    }

    .form-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid rgba(118, 200, 147, 0.2);
    }

    .form-section h2 {
      font-size: 1.6rem;
      color: #083344;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      color: #0891b2;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .form-group input {
      padding: 12px 16px;
      border: 2px solid #0891b2;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0891b2, #22c55e);
      color: white;
      box-shadow: 0 4px 15px rgba(8, 145, 178, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: #0891b2;
      border: 2px solid #0891b2;
    }

    .btn-secondary:hover {
      background: rgba(8, 145, 178, 0.1);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(118, 200, 147, 0.2);
    }

    .tab-btn {
      padding: 12px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: #666;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .tab-btn.active {
      border-bottom-color: #0891b2;
      color: #0891b2;
    }

    .tab-btn:hover {
      color: #0891b2;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .activity-list {
      list-style: none;
    }

    .activity-item {
      background: rgba(255, 255, 255, 0.5);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #0891b2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .activity-title {
      font-weight: 600;
      color: #083344;
      margin-bottom: 4px;
    }

    .activity-meta {
      font-size: 0.85rem;
      color: #666;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      padding: 20px;
      border: 2px solid rgba(8, 145, 178, 0.2);
      transition: all 0.3s;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(8, 145, 178, 0.15);
      border-color: #0891b2;
    }

    .project-card h3 {
      color: #083344;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .project-type {
      display: inline-block;
      background: #0891b2;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .project-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(8, 145, 178, 0.2);
      text-align: center;
    }

    .project-stat {
      font-size: 0.85rem;
      color: #666;
    }

    .project-stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0891b2;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: #0891b2;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #dc2626;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #22c55e;
    }

    @media (max-width: 768px) {
      #main-content {
        padding: 20px;
      }

      .page-title {
        font-size: 1.8rem;
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  

  <script src="api.js"></script>
  <script>
    // AUTH GUARD — paste at top of every protected page
(function() {
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || 'null');
  if (!token || !user) {
    window.location.href = 'login.html';
    return;
  }

  // Role-based protection
  // On manager-only pages (dashboard.html, team.html, reports.html):
  if (user.role !== 'manager') window.location.href = 'dashboard-team.html';

  // On worker-only pages (dashboard-team.html, my-tasks.html):
  // if (user.role !== 'worker') window.location.href = 'dashboard.html';
})();
    let currentUser = null;
    let dashboardData = null;

    // Check authentication first
    function checkAuth() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return false;
      }
      return true;
    }

    async function loadUserProfile() {
      try {
        // Load profile
        const profileResponse = await getUserProfile();
        currentUser = profileResponse.user;

        // Load dashboard data
        dashboardData = await getUserDashboard();

        // Update UI
        updateProfileUI();
        loadProjects();
        loadTasks();
        loadActivity();
      } catch (error) {
        showAlert("Error loading profile: " + error.message, "error");
        console.error("Error:", error);
        // If 401, redirect to login
        if (error.message.includes("401")) {
          window.location.href = "/login.html";
        }
      }
    }

    function updateProfileUI() {
      if (!currentUser) return;

      document.getElementById("userName").textContent = currentUser.name;
      document.getElementById("userEmail").textContent = currentUser.email;
      document.getElementById("userRole").textContent = currentUser.role === "manager" ? "Manager" : "Team Member";
      document.getElementById("profileAvatar").textContent = currentUser.name.charAt(0).toUpperCase();

      // Update form
      document.getElementById("nameInput").value = currentUser.name;
      document.getElementById("emailInput").value = currentUser.email;

      // Update stats
      if (dashboardData && dashboardData.stats) {
        document.getElementById("statProjects").textContent = dashboardData.stats.totalProjects;
        document.getElementById("statScrumProjects").textContent = dashboardData.stats.scrumProjects;
        document.getElementById("statKanbanProjects").textContent = dashboardData.stats.kanbanProjects;
        document.getElementById("statTasksDone").textContent = dashboardData.stats.tasksByStatus.done || 0;
      }
    }

    async function loadProjects() {
      try {
        const response = await getUserProjects();
        const projects = response.projects || [];

        let html = '';
        if (projects.length === 0) {
          html = '<div class="loading">No projects yet. Create one to get started!</div>';
        } else {
          projects.forEach(project => {
            const badge = project.type === "scrum" ? "🔄 Scrum" : "📋 Kanban";
            html += `
              <div class="project-card" onclick="navigateToProject('${project._id}')">
                <div>${badge}</div>
                <h3>${project.name}</h3>
                ${project.description ? `<p style="color: #666; font-size: 0.9rem; margin-bottom: 12px;">${project.description}</p>` : ''}
                <div class="project-stats">
                  <div class="project-stat">
                    <div class="project-stat-value">${project.stats?.sprints || 0}</div>
                    <div>Sprints</div>
                  </div>
                  <div class="project-stat">
                    <div class="project-stat-value">${project.stats?.tasks || 0}</div>
                    <div>Tasks</div>
                  </div>
                  <div class="project-stat">
                    <div class="project-stat-value">${project.stats?.tasksAssignedToUser || 0}</div>
                    <div>Assigned</div>
                  </div>
                </div>
              </div>
            `;
          });
        }

        document.getElementById("projectsList").innerHTML = html;
      } catch (error) {
        console.error("Error loading projects:", error);
        document.getElementById("projectsList").innerHTML = `<div class="error">Error loading projects</div>`;
      }
    }

    async function loadTasks() {
      try {
        if (!dashboardData || !dashboardData.assignedTasks) {
          document.getElementById("tasksList").innerHTML = '<div class="loading">No tasks assigned</div>';
          return;
        }

        const tasks = dashboardData.assignedTasks || [];
        
        let html = '';
        if (tasks.length === 0) {
          html = '<div class="loading">No tasks assigned to you</div>';
        } else {
          html = '<ul class="activity-list">';
          tasks.forEach(task => {
            const statusColor = task.status === 'done' ? '#10b981' : task.status === 'inprogress' ? '#f59e0b' : '#6b7280';
            html += `
              <li class="activity-item">
                <div>
                  <div class="activity-title">${task.title}</div>
                  <div class="activity-meta">
                    <strong>${task.projectId?.name || 'N/A'}</strong> • 
                    Status: <span style="color: ${statusColor}; font-weight: 600;">${task.status.toUpperCase()}</span>
                  </div>
                </div>
              </li>
            `;
          });
          html += '</ul>';
        }

        document.getElementById("tasksList").innerHTML = html;
      } catch (error) {
        console.error("Error loading tasks:", error);
        document.getElementById("tasksList").innerHTML = `<div class="error">Error loading tasks</div>`;
      }
    }

    async function loadActivity() {
      try {
        const response = await getUserActivity();
        
        let html = '<ul class="activity-list">';

        if (response.recentAssignedTasks && response.recentAssignedTasks.length > 0) {
          html += '<li style="margin: 16px 0; font-weight: 600; color: #0891b2;">Recent Assigned Tasks:</li>';
          response.recentAssignedTasks.forEach(task => {
            html += `
              <li class="activity-item">
                <div>
                  <div class="activity-title">${task.title}</div>
                  <div class="activity-meta">Assigned by ${task.createdBy?.name || 'Someone'} in ${task.projectId?.name || 'N/A'}</div>
                </div>
              </li>
            `;
          });
        }

        if (response.recentCreatedTasks && response.recentCreatedTasks.length > 0) {
          html += '<li style="margin: 16px 0; font-weight: 600; color: #0891b2;">Tasks You Created:</li>';
          response.recentCreatedTasks.forEach(task => {
            html += `
              <li class="activity-item">
                <div>
                  <div class="activity-title">${task.title}</div>
                  <div class="activity-meta">Created in ${task.projectId?.name || 'N/A'}</div>
                </div>
              </li>
            `;
          });
        }

        if (response.activeSprints && response.activeSprints.length > 0) {
          html += '<li style="margin: 16px 0; font-weight: 600; color: #0891b2;">Active Sprints:</li>';
          response.activeSprints.forEach(sprint => {
            html += `
              <li class="activity-item">
                <div>
                  <div class="activity-title">${sprint.sprintName}</div>
                  <div class="activity-meta">In ${sprint.projectId?.name || 'N/A'}</div>
                </div>
              </li>
            `;
          });
        }

        html += '</ul>';
        if (html === '<ul class="activity-list"></ul>') {
          html = '<div class="loading">No activity yet</div>';
        }

        document.getElementById("activityList").innerHTML = html;
      } catch (error) {
        console.error("Error loading activity:", error);
        document.getElementById("activityList").innerHTML = `<div class="error">Error loading activity</div>`;
      }
    }

    function switchTab(tabName) {
      // Hide all tabs
      document.querySelectorAll(".tab-content").forEach(tab => {
        tab.classList.remove("active");
      });

      // Remove active from all buttons
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      // Show selected tab
      document.getElementById(tabName).classList.add("active");
      event.target.classList.add("active");
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("nameInput").value.trim();
      const email = document.getElementById("emailInput").value.trim();

      if (!name || !email) {
        showAlert("Please fill in all fields", "error");
        return;
      }

      try {
        const response = await updateUserProfile(name, email);
        currentUser = response.user;
        updateProfileUI();
        showAlert("Profile updated successfully!", "success");
      } catch (error) {
        showAlert("Error updating profile: " + error.message, "error");
      }
    });

    function resetForm() {
      if (currentUser) {
        document.getElementById("nameInput").value = currentUser.name;
        document.getElementById("emailInput").value = currentUser.email;
      }
    }

    function navigateToProject(projectId) {
      localStorage.setItem("activeProject", projectId);
      window.location.href = "/projects.html";
    }

    function navigateToDashboard() {
      const userRole = currentUser?.role || 'member';
      if (userRole === 'manager') {
        window.location.href = '/dashboard.html';
      } else {
        window.location.href = '/dashboard-team.html';
      }
    }

    function navigateToTasks() {
      window.location.href = '/my-tasks.html';
    }

    function navigateToProjects() {
      window.location.href = '/projects.html';
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.clear();
        window.location.href = '/login.html';
      }
    }

    function showAlert(message, type) {
      const alertContainer = document.getElementById("alertContainer");
      const className = type === "error" ? "error" : "success";
      const html = `<div class="${className}" style="margin-bottom: 20px;">${message}</div>`;
      alertContainer.innerHTML = html;

      setTimeout(() => {
        alertContainer.innerHTML = "";
      }, 4000);
    }

    // Load on page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadUserProfile);
    } else {
      loadUserProfile();
    }

    // Navigation functions
    function navigateTo(page) {
      window.location.href = page;
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.clear();
        window.location.href = 'index.html';
      }
    }

    function navigateToProject(projectId) {
      window.location.href = `sprint.html?projectId=${projectId}`;
    }
  </script>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span style="font-size:1.8rem;font-weight:900;color:#D9ED92;">FlowBoard</span>
        <button class="sidebar-resize-btn" id="sidebarResizeBtn" title="Toggle sidebar size">⟷</button>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" onclick="navigateTo('kanban-board.html')">Kanban Board</button>
        <button class="sidebar-btn" onclick="navigateTo('projects.html')">Projects</button>
        <button class="sidebar-btn" onclick="navigateTo('dashboard.html')">Dashboard</button>
        <button class="sidebar-btn" onclick="navigateTo('sprint.html')">Sprints</button>
        <button class="sidebar-btn" onclick="navigateTo('team.html')">Team</button>
        <button class="sidebar-btn active">Profile</button>
        <button class="sidebar-btn" onclick="navigateTo('settings.html')">Settings</button>
        <button class="sidebar-btn" onclick="logout()">Logout</button>
      </nav>
    </aside>

    <main id="main-content">
      <div class="profile-section">
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar" title="Click to change avatar">
            <span id="avatarInitials">JD</span>
          </div>
          <div class="profile-info">
            <h1 id="profileName">John Doe</h1>
            <div class="role" id="profileRole">Senior Developer</div>
            <div class="department" id="profileDepartment">Engineering Department</div>
          </div>
        </div>

        <form id="profileForm">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" class="form-input" id="firstName" value="John">
            </div>
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-input" id="lastName" value="Doe">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="email" value="john.doe@company.com">
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-input" id="phone" value="+1 (555) 123-4567">
            </div>
            <div class="form-group">
              <label class="form-label">Job Title</label>
              <input type="text" class="form-input" id="jobTitle" value="Senior Software Developer">
            </div>
            <div class="form-group">
              <label class="form-label">Department</label>
              <select class="form-input" id="department">
                <option value="engineering">Engineering</option>
                <option value="design">Design</option>
                <option value="marketing">Marketing</option>
                <option value="sales">Sales</option>
                <option value="hr">Human Resources</option>
                <option value="finance">Finance</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Employee ID</label>
              <input type="text" class="form-input" id="employeeId" value="EMP-2024-001" readonly>
            </div>
            <div class="form-group">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-input" id="startDate" value="2024-01-15">
            </div>
            <div class="form-group full-width">
              <label class="form-label">Bio</label>
              <textarea class="form-input form-textarea" id="bio" placeholder="Tell us about yourself...">Experienced software developer with 5+ years in full-stack development. Passionate about creating efficient solutions and mentoring junior developers.</textarea>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Skills</label>
              <input type="text" class="form-input" id="skillsInput" placeholder="Add skills (press Enter to add)">
              <div class="skills-container" id="skillsContainer">
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">React</span>
                <span class="skill-tag">Node.js</span>
                <span class="skill-tag">Project Management</span>
                <span class="skill-tag">Team Leadership</span>
              </div>
            </div>
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="submit" class="btn">Save Changes</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
          </div>
        </form>
      </div>

      <!-- Performance Stats -->
      <div class="profile-section">
        <h3 style="margin-top:0;color:#34A0A4;">Performance Overview</h3>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number" id="completedTasks">42</div>
            <div class="stat-label">Tasks Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="activeProjects">5</div>
            <div class="stat-label">Active Projects</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="teamCollaboration">98%</div>
            <div class="stat-label">Team Rating</div>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

</html>
