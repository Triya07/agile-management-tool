<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Agile Management Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0891b2 0%, #0e7490 50%, #083344 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(8, 51, 68, 0.3);
      padding: 40px 36px 32px 36px;
      min-width: 340px;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .login-logo-text {
      font-size: 2.2rem;
      font-weight: 900;
      font-family: 'Segoe UI', 'Arial Black', sans-serif;
      background: linear-gradient(135deg, #0891b2, #22c55e, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      margin-right: 12px;
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 600;
      background: linear-gradient(135deg, #0e7490, #059669);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 18px;
    }
    .login-form input {
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #06b6d4;
      font-size: 1rem;
      outline: none;
      background: rgba(6, 182, 212, 0.05);
      transition: all 0.3s;
      color: #083344;
    }
    .login-form input:focus {
      border: 2px solid #22c55e;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
    }
    .role-select {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 10px;
    }
    .role-btn {
      padding: 12px 28px;
      border-radius: 25px;
      border: 2px solid #06b6d4;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(6, 182, 212, 0.1);
      color: #0e7490;
      transition: all 0.3s;
    }
    .role-btn.active, .role-btn:focus {
      background: linear-gradient(135deg, #0891b2, #22c55e);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(8, 145, 178, 0.3);
    }
    .login-btn {
      background: linear-gradient(135deg, #0891b2 0%, #22c55e 50%, #10b981 100%);
      color: #fff;
      border: none;
      padding: 14px 0;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 8px;
      box-shadow: 0 6px 20px rgba(8, 145, 178, 0.25);
      cursor: pointer;
      transition: all 0.3s;
    }
    .login-btn:hover {
      background: linear-gradient(135deg, #22c55e 0%, #059669 100%);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.35);
      transform: translateY(-2px);
    }
    .signup-link {
      margin-top: 18px;
      font-size: 1rem;
      color: #0e7490;
      text-decoration: underline;
      cursor: pointer;
      display: block;
      transition: color 0.3s;
    }
    .signup-link:hover {
      color: #22c55e;
    }
    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="login-container fade-in">
    <div class="login-logo">
      <span class="login-logo-text">FlowBoard</span>
    </div>
    <div class="login-title">Welcome Back</div>
    <form class="login-form">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <div class="role-select">
        <button type="button" class="role-btn active" id="role-manager">Manager</button>
        <button type="button" class="role-btn" id="role-member">Member</button>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:0.9rem;margin:8px 0;">
        <input type="checkbox" id="rememberMe" style="margin:0;">
        <span>Remember me</span>
      </label>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <span class="signup-link" onclick="window.location.href='signup.html'">Don't have an account? Sign up</span>
  </div>
  <script>
    // Notification function
    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        z-index: 9999;
        animation: slideIn 0.3s ease;
        max-width: 300px;
      `;
      
      if (type === 'error') {
        notification.style.background = '#ef4444';
        notification.style.color = '#fff';
      } else if (type === 'success') {
        notification.style.background = '#22c55e';
        notification.style.color = '#fff';
      }
      
      notification.textContent = message;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }

    // Role selection toggle
    const managerBtn = document.getElementById('role-manager');
    const memberBtn = document.getElementById('role-member');
    let selectedRole = 'manager';
    
    managerBtn.addEventListener('click', function(e) {
      e.preventDefault();
      managerBtn.classList.add('active');
      memberBtn.classList.remove('active');
      selectedRole = 'manager';
    });
    memberBtn.addEventListener('click', function(e) {
      e.preventDefault();
      memberBtn.classList.add('active');
      managerBtn.classList.remove('active');
      selectedRole = 'member';
    });
    
    // Simple login form handling with backend
    document.querySelector('.login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = this.querySelector('input[type="email"]').value.trim();
      const password = this.querySelector('input[type="password"]').value;
      const rememberMe = this.querySelector('input[type="checkbox"]')?.checked || false;
      
      // Basic validation
      if (!email || !password) {
        showNotification('Please fill in all fields', 'error');
        return;
      }
      
      if (!email.includes('@')) {
        showNotification('Please enter a valid email address', 'error');
        return;
      }
      
      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email,
            password
          })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          // Save user data
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));
          localStorage.setItem('userRole', result.user.role);
          localStorage.setItem('currentUser', result.user.name);
          localStorage.setItem('userEmail', result.user.email);
          localStorage.setItem('isLoggedIn', 'true');
          
          if (rememberMe) {
            localStorage.setItem('rememberMe', 'true');
          }
          
          showNotification('Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            if (result.user.role === 'manager') {
              window.location.href = 'projects.html';
            } else {
              window.location.href = 'dashboard-team.html';
            }
          }, 1000);
        } else {
          showNotification(result.message || 'Invalid email or password', 'error');
        }
      } catch (err) {
        console.error('Login error:', err);
        showNotification('Connection error. Make sure the backend is running on http://localhost:5000', 'error');
      }
    });
  </script>
</body>
</html>
